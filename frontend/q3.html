<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q3 · Tiện ích phòng</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:34px;font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fb}.wrap{max-width:940px;margin:auto}.eyebrow{color:#7a3fc1;font-weight:750;font-size:.78rem;letter-spacing:.08em}h2{margin:7px 0;font-size:1.65rem}.lead{margin:0 0 24px;color:#667085}.card{background:#fff;border:1px solid #dfe4ef;border-radius:14px;padding:22px;box-shadow:0 8px 28px rgba(25,40,75,.06)}form{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}label{display:grid;gap:7px;font-size:.8rem;font-weight:650;color:#475467}select,input{width:100%;padding:11px 12px;border:1px solid #cfd6e4;border-radius:8px;font:inherit;background:#fff}button{border:0;border-radius:8px;padding:12px 18px;background:#7a3fc1;color:#fff;font-weight:700;cursor:pointer}.result{margin-top:22px}.note{color:#667085;font-size:.85rem}.error{color:#b42318;background:#fef3f2;padding:12px;border-radius:8px}.amenities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.amenity{border:1px solid #e7e1ee;border-left:4px solid #7a3fc1;border-radius:10px;padding:15px}.amenity h3{font-size:.95rem;margin:0 0 6px}.amenity p{font-size:.82rem;color:#667085;margin:0 0 9px;line-height:1.45}.price{font-size:.82rem;font-weight:750;color:#7a3fc1}@media(max-width:720px){body{padding:20px}form,.amenities{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="wrap"><div class="eyebrow">QUERY 3</div><h2>Tiện ích của một phòng</h2><p class="lead">Liệt kê tiện ích theo partition (hotel_id, room_id).</p>
<div class="card"><form id="form"><label>Khách sạn<select id="hotel"><option value="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaa001">Lotus Riverside</option><option value="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaa002">Saigon Central</option><option value="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaa003">Da Lat Pine</option></select></label><label>Room ID<input id="room" value="bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbb101" required></label><button type="submit">Xem tiện ích</button></form><div id="result" class="result"><p class="note">Phòng mẫu Lotus 101 có ba tiện ích.</p></div></div>
</div><script>
const hotel=document.querySelector('#hotel'),room=document.querySelector('#room'),result=document.querySelector('#result'),rooms={"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaa001":"bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbb101","aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaa002":"bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbb201","aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaa003":"bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbb301"};const money=v=>Number(v)===0?'Miễn phí':new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(v);hotel.addEventListener('change',()=>room.value=rooms[hotel.value]);
document.querySelector('#form').addEventListener('submit',async event=>{event.preventDefault();result.innerHTML='<p class="note">Đang tải…</p>';const params=new URLSearchParams({hotel_id:hotel.value,room_id:room.value});try{const response=await fetch('/api/q3/room-amenities?'+params);if(!response.ok)throw new Error((await response.json()).detail||'Không thể tải dữ liệu');const rows=await response.json();if(!rows.length){result.innerHTML='<p class="note">Phòng này chưa có tiện ích.</p>';return}result.innerHTML=`<div class="amenities">${rows.map(a=>`<article class="amenity"><h3>${a.amenity_name}</h3><p>${a.description}</p><div class="price">${money(a.price)}</div></article>`).join('')}</div>`}catch(error){result.innerHTML=`<div class="error">${error.message}</div>`}});
</script></body></html>
