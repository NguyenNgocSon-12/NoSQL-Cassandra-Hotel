<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q7 · Lịch sử đặt phòng</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:34px;font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fb}.wrap{max-width:1000px;margin:auto}.eyebrow{color:#176b87;font-weight:750;font-size:.78rem;letter-spacing:.08em}h2{margin:7px 0;font-size:1.65rem}.lead{margin:0 0 24px;color:#667085}.card{background:#fff;border:1px solid #dfe4ef;border-radius:14px;padding:22px;box-shadow:0 8px 28px rgba(25,40,75,.06)}form{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end}label{display:grid;gap:7px;font-size:.8rem;font-weight:650;color:#475467}select{width:100%;padding:11px 12px;border:1px solid #cfd6e4;border-radius:8px;font:inherit;background:#fff}button{border:0;border-radius:8px;padding:12px 18px;background:#176b87;color:#fff;font-weight:700;cursor:pointer}.result{margin-top:22px}.note{color:#667085;font-size:.85rem}.error{color:#b42318;background:#fef3f2;padding:12px;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{padding:12px 9px;border-bottom:1px solid #eaecf0;text-align:left}th{color:#667085;font-size:.74rem}.price{font-weight:750;color:#08783e}.badge{padding:4px 8px;border-radius:999px;background:#e8f7ef;color:#08783e;font-size:.69rem;font-weight:750}@media(max-width:740px){body{padding:20px}form{grid-template-columns:1fr}table{display:block;overflow:auto}}
  </style>
</head>
<body><div class="wrap"><div class="eyebrow">QUERY 7</div><h2>Lịch sử đặt phòng của khách hàng</h2><p class="lead">Các booking được Cassandra sắp xếp theo ngày check-in mới nhất trước.</p>
<div class="card"><form id="form"><label>Khách hàng<select id="guest"><option value="cccccccc-cccc-4ccc-8ccc-ccccccccc001">Nguyễn Minh An</option><option value="cccccccc-cccc-4ccc-8ccc-ccccccccc002">Trần Ngọc Mai</option><option value="cccccccc-cccc-4ccc-8ccc-ccccccccc003">Lê Hoàng Minh</option></select></label><button type="submit">Xem lịch sử</button></form><div id="result" class="result"><p class="note">Nguyễn Minh An có hai booking mẫu.</p></div></div>
</div><script>
const result=document.querySelector('#result'),money=v=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(v);
document.querySelector('#form').addEventListener('submit',async event=>{event.preventDefault();result.innerHTML='<p class="note">Đang tải…</p>';const params=new URLSearchParams({guest_id:document.querySelector('#guest').value});try{const response=await fetch('/api/q7/guest-reservations?'+params);if(!response.ok)throw new Error((await response.json()).detail||'Không thể tải dữ liệu');const rows=await response.json();if(!rows.length){result.innerHTML='<p class="note">Khách hàng chưa có lịch sử đặt phòng.</p>';return}result.innerHTML=`<table><thead><tr><th>Check-in</th><th>Check-out</th><th>Khách sạn</th><th>Phòng</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.check_in}</td><td>${r.check_out}</td><td>${r.hotel_name}</td><td>${r.room_number}</td><td class="price">${money(r.total_amount)}</td><td><span class="badge">${r.status}</span></td></tr>`).join('')}</tbody></table>`}catch(error){result.innerHTML=`<div class="error">${error.message}</div>`}});
</script></body></html>
