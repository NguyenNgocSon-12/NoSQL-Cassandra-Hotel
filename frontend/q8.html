<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q8 · Danh sách check-in</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:34px;font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fb}.wrap{max-width:1000px;margin:auto}.eyebrow{color:#3157d5;font-weight:750;font-size:.78rem;letter-spacing:.08em}h2{margin:7px 0;font-size:1.65rem}.lead{margin:0 0 24px;color:#667085}.card{background:#fff;border:1px solid #dfe4ef;border-radius:14px;padding:22px;box-shadow:0 8px 28px rgba(25,40,75,.06)}form{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}label{display:grid;gap:7px;font-size:.8rem;font-weight:650;color:#475467}select,input{width:100%;padding:11px 12px;border:1px solid #cfd6e4;border-radius:8px;font:inherit;background:#fff}button{border:0;border-radius:8px;padding:12px 18px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}.result{margin-top:22px}.note{color:#667085;font-size:.85rem}.error{color:#b42318;background:#fef3f2;padding:12px;border-radius:8px}.guests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.guest{border:1px solid #e1e6f0;border-radius:11px;padding:16px}.guest h3{margin:0 0 6px;font-size:1rem}.guest p{margin:4px 0;color:#667085;font-size:.82rem}.badge{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;background:#e8f7ef;color:#08783e;font-size:.69rem;font-weight:750}@media(max-width:700px){body{padding:20px}form,.guests{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="wrap"><div class="eyebrow">QUERY 8</div><h2>Khách check-in theo khách sạn và ngày</h2><p class="lead">Phục vụ lễ tân chuẩn bị danh sách khách đến trong ngày.</p>
<div class="card"><form id="form"><label>Khách sạn<select id="hotel"><option value="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaa001">Lotus Riverside Hotel</option></select></label><label>Ngày check-in<input id="date" type="date" value="2026-09-25" required></label><button type="submit">Xem danh sách</button></form><div id="result" class="result"><p class="note">Ngày mẫu: 25/09/2026 hoặc 02/10/2026.</p></div></div>
</div><script>
const result=document.querySelector('#result');document.querySelector('#form').addEventListener('submit',async event=>{event.preventDefault();result.innerHTML='<p class="note">Đang tải…</p>';const params=new URLSearchParams({hotel_id:document.querySelector('#hotel').value,check_in_date:document.querySelector('#date').value});try{const response=await fetch('/api/q8/checkins?'+params);if(!response.ok)throw new Error((await response.json()).detail||'Không thể tải dữ liệu');const rows=await response.json();if(!rows.length){result.innerHTML='<p class="note">Không có khách check-in trong ngày đã chọn.</p>';return}result.innerHTML=`<div class="guests">${rows.map(r=>`<article class="guest"><h3>${r.guest_name}</h3><p>Phòng ${r.room_number}</p><p>${r.check_in_date} → ${r.check_out_date}</p><p>Reservation: ${r.reservation_id}</p><span class="badge">${r.status}</span></article>`).join('')}</div>`}catch(error){result.innerHTML=`<div class="error">${error.message}</div>`}});
</script></body></html>
