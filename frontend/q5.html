<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q5 · Lịch đặt phòng</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:34px;font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fb}.wrap{max-width:980px;margin:auto}.eyebrow{color:#7a3fc1;font-weight:750;font-size:.78rem;letter-spacing:.08em}h2{margin:7px 0;font-size:1.65rem}.lead{margin:0 0 24px;color:#667085}.card{background:#fff;border:1px solid #dfe4ef;border-radius:14px;padding:22px;box-shadow:0 8px 28px rgba(25,40,75,.06)}form{display:grid;grid-template-columns:180px 1fr auto;gap:14px;align-items:end}label{display:grid;gap:7px;font-size:.8rem;font-weight:650;color:#475467}input,select{width:100%;padding:11px 12px;border:1px solid #cfd6e4;border-radius:8px;font:inherit;background:#fff}button{border:0;border-radius:8px;padding:12px 18px;background:#7a3fc1;color:#fff;font-weight:700;cursor:pointer}.result{margin-top:22px}.note{color:#667085;font-size:.85rem}.error{color:#b42318;background:#fef3f2;padding:12px;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:12px 10px;border-bottom:1px solid #eaecf0;text-align:left}th{color:#667085;font-size:.76rem}.badge{padding:4px 8px;border-radius:999px;background:#e8f7ef;color:#08783e;font-size:.72rem;font-weight:750}.badge.cancelled{background:#fef3f2;color:#b42318}@media(max-width:680px){body{padding:20px}form{grid-template-columns:1fr}table{display:block;overflow:auto}}
  </style>
</head>
<body><div class="wrap"><div class="eyebrow">QUERY 5</div><h2>Lịch đặt của một phòng</h2><p class="lead">Lịch được trả về theo ngày nhận phòng mới nhất trước.</p>
<div class="card"><form id="form"><label>Khách sạn<select id="hotel"><option value="H001">H001</option><option value="H002">H002</option></select></label><label>Room ID<input id="room" value="11111111-1111-4111-8111-111111111101" required></label><button type="submit">Xem lịch</button></form><div id="result" class="result"><p class="note">Mẫu H001: room ID kết thúc 1101. Mẫu H002: room ID kết thúc 1201.</p></div></div>
</div><script>
const result=document.querySelector('#result'),room=document.querySelector('#room'),hotel=document.querySelector('#hotel');
hotel.addEventListener('change',()=>room.value=hotel.value==='H001'?'11111111-1111-4111-8111-111111111101':'11111111-1111-4111-8111-111111111201');
document.querySelector('#form').addEventListener('submit',async event=>{event.preventDefault();result.innerHTML='<p class="note">Đang tải…</p>';const params=new URLSearchParams({hotel_id:hotel.value,room_id:room.value});
try{const response=await fetch('/api/q5/room-reservations?'+params);if(!response.ok)throw new Error((await response.json()).detail||'Không thể tải dữ liệu');const rows=await response.json();if(!rows.length){result.innerHTML='<p class="note">Phòng này chưa có lịch đặt.</p>';return}result.innerHTML=`<table><thead><tr><th>Check-in</th><th>Check-out</th><th>Khách</th><th>Trạng thái</th><th>Reservation ID</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.check_in}</td><td>${r.check_out}</td><td>${r.guest_name}</td><td><span class="badge ${r.status==='CANCELLED'?'cancelled':''}">${r.status}</span></td><td>${r.reservation_id}</td></tr>`).join('')}</tbody></table>`}catch(error){result.innerHTML=`<div class="error">${error.message}</div>`}});
</script></body></html>
