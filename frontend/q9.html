<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q9 · Danh sách check-out</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:34px;font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fb}.wrap{max-width:1000px;margin:auto}.eyebrow{color:#c04b28;font-weight:750;font-size:.78rem;letter-spacing:.08em}h2{margin:7px 0;font-size:1.65rem}.lead{margin:0 0 24px;color:#667085}.card{background:#fff;border:1px solid #dfe4ef;border-radius:14px;padding:22px;box-shadow:0 8px 28px rgba(25,40,75,.06)}form{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}label{display:grid;gap:7px;font-size:.8rem;font-weight:650;color:#475467}select,input{width:100%;padding:11px 12px;border:1px solid #cfd6e4;border-radius:8px;font:inherit;background:#fff}button{border:0;border-radius:8px;padding:12px 18px;background:#c04b28;color:#fff;font-weight:700;cursor:pointer}.result{margin-top:22px}.note{color:#667085;font-size:.85rem}.error{color:#b42318;background:#fef3f2;padding:12px;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{padding:12px 9px;border-bottom:1px solid #eaecf0;text-align:left}th{color:#667085;font-size:.74rem}.price{font-weight:750;color:#c04b28}.badge{padding:4px 8px;border-radius:999px;background:#fff4e5;color:#9a6700;font-size:.69rem;font-weight:750}@media(max-width:740px){body{padding:20px}form{grid-template-columns:1fr}table{display:block;overflow:auto}}
  </style>
</head>
<body><div class="wrap"><div class="eyebrow">QUERY 9</div><h2>Khách check-out theo khách sạn và ngày</h2><p class="lead">Danh sách khách rời đi, phòng và tổng tiền cần đối soát.</p>
<div class="card"><form id="form"><label>Khách sạn<select id="hotel"><option value="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaa001">Lotus Riverside Hotel</option></select></label><label>Ngày check-out<input id="date" type="date" value="2026-09-28" required></label><button type="submit">Xem danh sách</button></form><div id="result" class="result"><p class="note">Ngày mẫu: 27–28/09/2026 hoặc 04/10/2026.</p></div></div>
</div><script>
const result=document.querySelector('#result'),money=v=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(v);document.querySelector('#form').addEventListener('submit',async event=>{event.preventDefault();result.innerHTML='<p class="note">Đang tải…</p>';const params=new URLSearchParams({hotel_id:document.querySelector('#hotel').value,check_out_date:document.querySelector('#date').value});try{const response=await fetch('/api/q9/checkouts?'+params);if(!response.ok)throw new Error((await response.json()).detail||'Không thể tải dữ liệu');const rows=await response.json();if(!rows.length){result.innerHTML='<p class="note">Không có khách check-out trong ngày đã chọn.</p>';return}result.innerHTML=`<table><thead><tr><th>Khách</th><th>Phòng</th><th>Check-in</th><th>Check-out</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.guest_name}</td><td>${r.room_number}</td><td>${r.check_in_date}</td><td>${r.check_out_date}</td><td class="price">${money(r.total_amount)}</td><td><span class="badge">${r.status}</span></td></tr>`).join('')}</tbody></table>`}catch(error){result.innerHTML=`<div class="error">${error.message}</div>`}});
</script></body></html>
