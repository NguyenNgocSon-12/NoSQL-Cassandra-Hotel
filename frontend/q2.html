<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q2 · Phòng theo loại</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:34px;font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fb}.wrap{max-width:1000px;margin:auto}.eyebrow{color:#3157d5;font-weight:750;font-size:.78rem;letter-spacing:.08em}h2{margin:7px 0;font-size:1.65rem}.lead{margin:0 0 24px;color:#667085}.card{background:#fff;border:1px solid #dfe4ef;border-radius:14px;padding:22px;box-shadow:0 8px 28px rgba(25,40,75,.06)}form{display:grid;grid-template-columns:1fr 220px auto;gap:14px;align-items:end}label{display:grid;gap:7px;font-size:.8rem;font-weight:650;color:#475467}select{width:100%;padding:11px 12px;border:1px solid #cfd6e4;border-radius:8px;font:inherit;background:#fff}button{border:0;border-radius:8px;padding:12px 18px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}.result{margin-top:22px}.note{color:#667085;font-size:.85rem}.error{color:#b42318;background:#fef3f2;padding:12px;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:12px 10px;border-bottom:1px solid #eaecf0;text-align:left}th{color:#667085;font-size:.76rem}.price{font-weight:750;color:#08783e}.badge{padding:4px 8px;border-radius:999px;background:#e8f7ef;color:#08783e;font-size:.7rem;font-weight:750}.badge.occupied{background:#fff4e5;color:#9a6700}@media(max-width:720px){body{padding:20px}form{grid-template-columns:1fr}table{display:block;overflow:auto}}
  </style>
</head>
<body><div class="wrap"><div class="eyebrow">QUERY 2</div><h2>Phòng theo khách sạn và loại phòng</h2><p class="lead">Truy vấn đúng partition key kết hợp hotel_id và room_type.</p>
<div class="card"><form id="form"><label>Khách sạn<select id="hotel"><option value="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaa001">Lotus Riverside</option><option value="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaa002">Saigon Central</option><option value="aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaa003">Da Lat Pine</option></select></label><label>Loại phòng<select id="type"></select></label><button type="submit">Tìm phòng</button></form><div id="result" class="result"><p class="note">Lotus Riverside có dữ liệu Deluxe và Suite.</p></div></div>
</div><script>
const hotel=document.querySelector('#hotel'),type=document.querySelector('#type'),result=document.querySelector('#result');const types={"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaa001":['Deluxe','Suite'],"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaa002":['Deluxe'],"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaa003":['Bungalow']};const money=v=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(v);function updateTypes(){type.innerHTML=types[hotel.value].map(value=>`<option>${value}</option>`).join('')}hotel.addEventListener('change',updateTypes);updateTypes();
document.querySelector('#form').addEventListener('submit',async event=>{event.preventDefault();result.innerHTML='<p class="note">Đang tải…</p>';const params=new URLSearchParams({hotel_id:hotel.value,room_type:type.value});try{const response=await fetch('/api/q2/rooms?'+params);if(!response.ok)throw new Error((await response.json()).detail||'Không thể tải dữ liệu');const rows=await response.json();if(!rows.length){result.innerHTML='<p class="note">Không có phòng thuộc loại đã chọn.</p>';return}result.innerHTML=`<table><thead><tr><th>Phòng</th><th>Tầng</th><th>Sức chứa</th><th>Giá</th><th>Trạng thái</th><th>Room ID</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${r.room_number}</strong></td><td>${r.floor}</td><td>${r.capacity} khách</td><td class="price">${money(r.price)}</td><td><span class="badge ${r.status==='OCCUPIED'?'occupied':''}">${r.status}</span></td><td>${r.room_id}</td></tr>`).join('')}</tbody></table>`}catch(error){result.innerHTML=`<div class="error">${error.message}</div>`}});
</script></body></html>
