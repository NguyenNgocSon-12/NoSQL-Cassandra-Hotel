<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q6 · Tra cứu booking</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:34px;font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fb}.wrap{max-width:880px;margin:auto}.eyebrow{color:#c04b28;font-weight:750;font-size:.78rem;letter-spacing:.08em}h2{margin:7px 0;font-size:1.65rem}.lead{margin:0 0 24px;color:#667085}.card{background:#fff;border:1px solid #dfe4ef;border-radius:14px;padding:22px;box-shadow:0 8px 28px rgba(25,40,75,.06)}form{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end}label{display:grid;gap:7px;font-size:.8rem;font-weight:650;color:#475467}input{width:100%;padding:11px 12px;border:1px solid #cfd6e4;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:12px 18px;background:#c04b28;color:#fff;font-weight:700;cursor:pointer}.result{margin-top:22px}.note{color:#667085;font-size:.85rem}.error{color:#b42318;background:#fef3f2;padding:12px;border-radius:8px}.booking{border:1px solid #eaecf0;border-radius:12px;overflow:hidden}.booking-head{padding:16px 18px;background:#fff8f5;display:flex;justify-content:space-between;align-items:center}.booking-head strong{font-size:1.05rem}.badge{padding:5px 9px;border-radius:999px;background:#e8f7ef;color:#08783e;font-size:.72rem;font-weight:750}.badge.cancelled{background:#fef3f2;color:#b42318}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:19px}.item span{display:block;color:#667085;font-size:.74rem;margin-bottom:4px}.amount{font-size:1.15rem;font-weight:800;color:#c04b28}@media(max-width:680px){body{padding:20px}form,.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="wrap"><div class="eyebrow">QUERY 6</div><h2>Tra cứu booking</h2><p class="lead">Nhập mã xác nhận để lấy toàn bộ thông tin đặt phòng trong một lần đọc.</p>
<div class="card"><form id="form"><label>Mã xác nhận<input id="code" value="CNF-Q456-001" required></label><button type="submit">Tra cứu</button></form><div id="result" class="result"><p class="note">Mã mẫu: CNF-Q456-001, CNF-Q456-002 hoặc CNF-Q456-003.</p></div></div>
</div><script>
const result=document.querySelector('#result'),money=value=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(value);
document.querySelector('#form').addEventListener('submit',async event=>{event.preventDefault();result.innerHTML='<p class="note">Đang tải…</p>';const code=document.querySelector('#code').value.trim();
try{const response=await fetch('/api/q6/reservations/'+encodeURIComponent(code));const data=await response.json();if(!response.ok)throw new Error(data.detail||'Không thể tải dữ liệu');result.innerHTML=`<div class="booking"><div class="booking-head"><strong>${data.confirmation_code}</strong><span class="badge ${data.status==='CANCELLED'?'cancelled':''}">${data.status}</span></div><div class="grid"><div class="item"><span>Khách sạn</span>${data.hotel_name} (${data.hotel_id})</div><div class="item"><span>Khách hàng</span>${data.guest_name}</div><div class="item"><span>Phòng</span>${data.room_number}</div><div class="item"><span>Thời gian</span>${data.check_in} → ${data.check_out}</div><div class="item"><span>Reservation ID</span>${data.reservation_id}</div><div class="item"><span>Tổng tiền</span><span class="amount">${money(data.total_amount)}</span></div></div></div>`}catch(error){result.innerHTML=`<div class="error">${error.message}</div>`}});
</script></body></html>
