services:
  cassandra:
    image: cassandra:4.1
    container_name: hotel-cassandra
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE CLUSTER' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./backend/modules:/modules:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        for file in /modules/*/schema.cql; do
          echo "Applying schema: $$file";
          cqlsh cassandra 9042 -f "$$file";
        done;
        for file in /modules/*/seed.cql; do
          echo "Applying seed: $$file";
          cqlsh cassandra 9042 -f "$$file";
        done
    restart: "no"

volumes:
  cassandra_data:
